[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "h-ide-vision"
version = "0.1.0"
description = "Visual target-resolution service for H-IDE"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "google-crc32c>=1.6,<2",
  "grpcio>=1.70,<2",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pillow>=11,<12",
  "protobuf>=5.29,<7",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<16",
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.70,<2",
  "mypy>=1.14,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]
# Marker only: the retained FoundationPose spike lives under ``experiments``
# and is excluded from the installed product package and runtime registry.
experimental-foundationpose = []

[project.scripts]
h-ide-vision = "h_ide_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
h_ide_vision = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["src/h_ide_vision/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["h_ide_vision"]
strict = true
warn_unused_ignores = false
exclude = ["src/h_ide_vision/generated", "src/h_ide_vision/ingress/proto_codec.py", "src/h_ide_vision/ingress/server.py"]

[[tool.mypy.overrides]]
module = ["google_crc32c", "grpc.*", "google.protobuf.*"]
ignore_missing_imports = true
