[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h-ide-mujoco-sonic"
version = "0.1.0"
description = "Isolated MuJoCo and NVIDIA SONIC adapter for H-IDE simulation"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2,<3",
  "pyyaml>=6,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
runtime = [
  "mujoco>=3.3,<4",
  "onnxruntime>=1.16,<2",
  "onnx>=1.16,<2",
  "pyzmq>=26,<28",
  "cyclonedds==11.0.1",
  "loguru>=0.7,<1",
  "pygame>=2.6,<3",
]
ros = ["rclpy>=4,<5"]
test = [
  "pytest>=8,<9",
  "jsonschema>=4,<5",
  "scipy>=1.14,<2",
]

[project.scripts]
hide-mujoco-sonic = "hide_mujoco_sonic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
