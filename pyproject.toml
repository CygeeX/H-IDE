[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-action-console"
version = "0.1.0"
description = "Workstation robot action control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "websockets>=14,<18",
]

[project.scripts]
h-ide-admin-bootstrap = "services.control_api.admin_cli:cli"
h-ide-office-v2-bootstrap = "services.scene_api.office_v2_bootstrap:main"

[project.optional-dependencies]
daaam = [
  "PyYAML>=6,<7",
]
scene = [
  "numpy>=2.1,<3",
  "open3d-cpu==0.19.0",
  "Pillow>=11,<12",
]
test = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["packages*", "services*"]

[tool.setuptools.package-data]
"services.scene_api" = ["builtin/office_v2/*"]
