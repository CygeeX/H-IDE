amcl:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: false
    # Jazzy loads the stock BT plugins automatically.  Supplying the full
    # pre-Jazzy list here registers each built-in node twice and aborts with
    # "ID [ComputePathToPose] already registered".  Keep this empty unless a
    # project-specific plugin is added.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Every Mission node is an independent, human-approved navigation
      # action.  A stateful goal checker may retain its "XY reached" latch
      # after one action and let the next same-heading translation succeed
      # without moving.  Always re-check both XY and yaw for every control
      # cycle so a Robot Agent success receipt reflects a real arrival.
      stateful: false
      # SONIC's dynamic gait cannot execute differential-drive-style creep.
      # Match this tolerance to the 0.10 m command deadband so Nav2 can settle
      # instead of asking a walking policy for endless centimetre corrections.
      # A learned 29-DoF gait has a finite footstep and upper-body sway; asking
      # it to settle like a differential-drive base caused a successful short
      # translation to spend the rest of its Robot Agent lease oscillating on
      # centimetre/yaw corrections. These remain Nav2-owned arrival bounds and
      # are tighter than the workstation's visual approach standoff policy.
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.35
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      # Match H-IDE MissionEnvelope.maximumSpeedMps. The NavigateToPose action
      # has no per-goal speed field, so this controller limit is the enforcing
      # boundary for the current simulation profile.
      max_vel_x: 0.20
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.10
      short_circuit_trajectory_evaluation: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.35
      footprint_padding: 0.02
      track_unknown_space: false
      always_send_full_costmap: true
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      robot_radius: 0.35
      footprint_padding: 0.02
      track_unknown_space: false
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /opt/h-ide-nav2/maps/office_floor.yaml

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # The workstation and operator approve an exact map goal.  Letting NavFn
      # silently substitute a point up to 0.5 m away can turn an unreachable
      # goal into a successful no-op.  An occupied/unreachable goal must fail
      # and return to Mission V2 for a reviewed replan instead.
      tolerance: 0.0
      use_astar: false
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    # Humanoid turning is a stepping gait, not an instantaneous differential-
    # drive yaw.  Keep Nav2's own Spin profile inside SONIC's auditable limit so
    # the downstream guard never silently changes the velocity Nav2 believes it
    # commanded.
    max_rotational_vel: 0.2
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.3

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: false

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server", "planner_server", "controller_server", "behavior_server", "bt_navigator", "waypoint_follower"]
