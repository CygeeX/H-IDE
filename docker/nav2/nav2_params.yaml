amcl:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: false
    # Jazzy loads the stock BT plugins automatically.  Supplying the full
    # pre-Jazzy list here registers each built-in node twice and aborts with
    # "ID [ComputePathToPose] already registered".  Keep this empty unless a
    # project-specific plugin is added.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    # The distro defaults contain a BackUp recovery. SONIC is forward-only in
    # the default Nav2 path, so both navigators must load the reviewed trees
    # shipped in this image instead of silently falling back to package data.
    default_nav_to_pose_bt_xml: /opt/h-ide-nav2/behavior_trees/navigate_to_pose_no_reverse.xml
    default_nav_through_poses_bt_xml: /opt/h-ide-nav2/behavior_trees/navigate_through_poses_no_reverse.xml
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Every Mission node is an independent, human-approved navigation
      # action.  A stateful goal checker may retain its "XY reached" latch
      # after one action and let the next same-heading translation succeed
      # without moving.  Always re-check both XY and yaw for every control
      # cycle so a Robot Agent success receipt reflects a real arrival.
      stateful: false
      # SONIC's dynamic gait cannot execute differential-drive-style creep.
      # Match this tolerance to the 0.10 m command deadband so Nav2 can settle
      # instead of asking a walking policy for endless centimetre corrections.
      # A learned 29-DoF gait has a finite footstep and upper-body sway; asking
      # it to settle like a differential-drive base caused a successful short
      # translation to spend the rest of its Robot Agent lease oscillating on
      # centimetre/yaw corrections. These remain Nav2-owned arrival bounds and
      # are tighter than the workstation's visual approach standoff policy.
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.35
    FollowPath:
      # Candidate controller only. motion_profile_manifest.json keeps product
      # FollowPath/NavigateToPose disabled until curved live acceptance; the
      # strict product runner uses ComputePathToPose -> Spin/DriveOnHeading.
      # Rotation Shim owns initial/final heading alignment and delegates only
      # forward path tracking to Nav2's Graceful controller. The shim is
      # closed-loop on measured odometry; SONIC never invents an angular rate
      # from its learned facing target.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_graceful_controller::GracefulController"
      # Twenty/ten degrees keep a hysteretic stop-and-turn handoff. Unlike the
      # eliminated RPP profile, Graceful has an explicit whole-command angular
      # bound after this handoff.
      angular_dist_threshold: 0.3490658503988659
      angular_disengage_threshold: 0.17453292519943295
      forward_sampling_distance: 0.6
      rotate_to_heading_angular_vel: 0.20
      max_angular_accel: 0.3
      simulate_ahead_time: 2.0
      rotate_to_goal_heading: true
      rotate_to_heading_once: false
      closed_loop: true
      use_path_orientations: false

      # These control-law/lookahead values are an Office V2 PGM proxy
      # calibration, not SONIC vendor limits and not a substitute for live
      # curved-path acceptance. Graceful forward-simulates each candidate
      # target against the local costmap and throws when none is collision
      # free. The runtime boundary must likewise reject any nonzero linear
      # command below SONIC Slow Walk's 0.20 m/s input instead of rounding it.
      min_lookahead: 0.25
      max_lookahead: 0.70
      max_robot_pose_search_dist: 3.0
      k_phi: 1.5
      k_delta: 0.5
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.20
      v_linear_max: 0.20
      v_angular_max: 0.25
      slowdown_radius: 1.5
      initial_rotation: false
      initial_rotation_tolerance: 0.75
      prefer_final_rotation: true
      # Rotation Shim is the nominal rotation owner. Keep Graceful's fallback
      # in-place law bounded too: for |error|<=pi, 0.30*pi*0.25<0.25,
      # while the explicit minimum remains the reviewed 0.20 rad/s turn.
      rotation_scaling_factor: 0.30
      v_angular_min_in_place: 0.20
      allow_backward: false
      in_place_collision_resolution: 0.1
      transform_tolerance: 0.2

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # G1's collision-observed navigation footprint is 0.25 m.  The product
      # static-plan verifier still requires 0.42 m along normal path segments;
      # this smaller Nav2 footprint exists so a collision-free pose reached
      # after whole-body visual scanning can generate the bounded recovery
      # prefix back into the fully reviewed clearance envelope.
      robot_radius: 0.25
      footprint_padding: 0.02
      track_unknown_space: false
      always_send_full_costmap: true
      # This simulation deliberately has no live laser obstacle layer. The
      # Office V2 static map must therefore be present in the controller's local
      # costmap as well as the global planner map; otherwise BaseObstacle sees
      # an empty grid and can cut a corner through fixed MuJoCo geometry.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      # Keep the planner and behavior collision checks on the same physical
      # footprint.  The independent static primitive verifier remains the
      # authority for the stricter 0.42 m nominal route clearance.
      robot_radius: 0.25
      footprint_padding: 0.02
      track_unknown_space: false
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /opt/h-ide-nav2/nav2/office_v2.yaml

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # The workstation and operator approve an exact map goal.  Letting NavFn
      # silently substitute a point up to 0.5 m away can turn an unreachable
      # goal into a successful no-op.  An occupied/unreachable goal must fail
      # and return to Mission V2 for a reviewed replan instead.
      tolerance: 0.0
      use_astar: false
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Backward recovery is intentionally absent. A failed forward plan returns
    # through the reviewed BT so Mission V2 can stop or request a new plan.
    behavior_plugins: ["spin", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    # The static primitive planner already proves every DriveOnHeading chord
    # against the generated Office V2 map with a 0.42 m clearance radius.  A
    # second, odometry-projected circular-footprint check repeatedly aborted at
    # the corridor column while MuJoCo reported zero physical contact. Disable
    # this duplicate prediction for the reviewed Spin/Drive primitives. The
    # global plan remains inflated-map checked and MuJoCo remains the
    # authoritative source of physical obstacle/contact evidence.
    simulate_ahead_time: 0.0
    # Humanoid turning is a sequence of learned planner clips, not an
    # instantaneous differential-drive yaw.  The pinned SONIC planner emits
    # about 44 frames at 30 Hz (1.47 s).  Keep the previously live-proven
    # 0.20 rad/s upper bound, but admit a new SONIC reference only after a
    # 0.30 rad command-facing change: 0.30 / 0.20 = 1.50 s.  This preserves the
    # responsive Nav2 Spin while preventing a new clip from replacing the
    # preceding endpoint braking clip.  The downstream guard verifies the
    # signed acceleration ramp without changing it.
    max_rotational_vel: 0.2
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.3

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: false

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server", "planner_server", "controller_server", "behavior_server", "bt_navigator", "waypoint_follower"]
