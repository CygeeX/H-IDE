semantic_tests:
  - id: vlm_find_meeting_table
    prompt: 找到会议桌，并给出适合机器人停靠的桌前目标点。
    expected_object_ids: [meeting_table]
    acceptable_target_ids: [target_meeting_table_front]
  - id: vlm_find_water_dispenser
    prompt: 沿走廊寻找饮水机，停在饮水机前。
    expected_object_ids: [water_dispenser]
    acceptable_target_ids: [target_water_dispenser]
  - id: vlm_find_coffee_machine
    prompt: 去茶水间的咖啡机旁边。
    expected_object_ids: [coffee_machine, pantry_sign]
    acceptable_target_ids: [target_coffee_machine]
  - id: vlm_find_reception
    prompt: 找到前台并停在接待人员一侧。
    expected_object_ids: [reception_desk, reception_sign]
    acceptable_target_ids: [target_reception]
  - id: nav_avoid_corridor_column
    prompt: 从西侧起点前往走廊东端，避开固定立柱。
    expected_object_ids: [corridor_column]
    acceptable_target_ids: [target_corridor_east]
