schema_version: h-ide.office-scene/3
scene_id: office_v2
title: H-IDE Office V2
description: >-
  A single-floor office used to validate RGB-D/VLM grounding and safe Nav2
  navigation. This file is the only content manifest: MuJoCo visuals and
  collision proxies, the Nav2 map, and isolated evaluation truth are all
  generated from it.
generator_version: office-v2-generator/3

runtime_boundary:
  product_may_read:
    - generated/mujoco/office_v2.include.xml
    - generated/mujoco/office_v2.runtime.xml
    - generated/mujoco/textures/*.png
    - generated/nav2/office_v2.yaml
    - generated/nav2/office_v2.pgm
    - generated/runtime_manifest.json
    - generated/visual_manifest.json
    - generated/inspection_catalog.json
  evaluation_only:
    - evaluation/manifest.json
  forbidden_product_inputs:
    - semantic
    - targets
    - semantic_tests

provenance:
  generated_assets:
    author: H-IDE contributors
    license: CC0-1.0
    source_url: generated://tools/build_scene.py
    source_revision: office-v2-generator/3
    attribution: H-IDE Office V2 procedural textures, architectural dressing, and signs
  third_party_assets: []
  design_references:
    - project: MuJoCo
      url: https://github.com/google-deepmind/mujoco
      revision: 3dd2bc3b52e6697d751a9f4bf1b2c3a3b1c83bf2
      license: Apache-2.0
      files_copied: []
    - project: MuJoCo Menagerie
      url: https://github.com/google-deepmind/mujoco_menagerie
      revision: da76818e269b82289eba39808e2fb91d679d6994
      license: Apache-2.0 for repository-level content; per-model licenses vary
      files_copied: []
    - project: RoboCasa
      url: https://github.com/robocasa/robocasa
      revision: 921c9a5736a8d0ea5589657898aadcfa55a6a195
      license: MIT code; CC-BY-4.0 assets and datasets
      files_copied: []
    - project: Poly Haven
      url: https://polyhaven.com/
      revision: catalog-reviewed-2026-08-24
      license: CC0-1.0 assets
      files_copied: []

bounds:
  min: [-8.0, -6.0, 0.0]
  max: [8.0, 6.0, 3.0]

map:
  frame_id: map
  resolution: 0.05
  origin: [-8.0, -6.0, 0.0]
  size: [16.0, 12.0]
  free_value: 254
  occupied_value: 0
  occupied_thresh: 0.65
  free_thresh: 0.196
  mode: trinary

navigation:
  # These values are also asserted against the Nav2 local/global costmap
  # configuration. They define the minimum full-body clearance required by
  # every generated navigation target.
  robot_radius_m: 0.35
  footprint_padding_m: 0.02

# Product-safe semantic navigation and observation stations.  This catalog is
# deliberately separate from evaluator-only object labels and target answers:
# it tells the Mission runtime where named regions and collision-checked scan
# stations are, but never tells the VLM which objects it should report there.
