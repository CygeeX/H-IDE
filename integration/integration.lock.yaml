# FARM is evaluated behind the proposed MemoryProvider boundary only.  No FARM
# source, model, dataset or runtime is distributed or started by this release.
proposed_providers:
  - id: farm
    upstream_repository: https://github.com/GoldenGait/FARM-Project.git
    upstream_revision: 2fcaf8602e741341a70ca980133f7ff05cfc83a2
    license: AGPL-3.0
    integration_status: proposed-shadow-provider
    distributed: false
    runtime_default: false
    commercial_legal_review_required: true

protocols:
  mission_api: v2
  assistant_conversation: v2
  visual_task: v2
  robot_observation: v1
  robot_agent_wire: v1
  ros_domain_simulation: 232
  ros_domain_live: 231
  unitree_dds_simulation: 230

models:
  text:
    provider: deepseek
    model: deepseek/deepseek-v4-flash
    credential_env: DEEPSEEK_API_KEY
  vision:
    provider: qwen
    model: qwen3-vl-plus
    credential_env: DASHSCOPE_API_KEY
  segmentation:
    provider: sam2
    checkpoint_sha256: 7402e0d864fa82708a20fbd15bc84245c2f26dff0eb43a4b5b93452deb34be69
    credential_env: HIDE_VISION_SAM2_CHECKPOINT
  locomotion:
    repository: nvidia/GEAR-SONIC
    revision: 9c0ff22b4ffec27c5392e8e284eb2f2df7a5b4e2
    cache_env: SONIC_HF_CACHE
    lock_file: components/h-ide-mujoco-sonic/config/sonic-models.lock.json

external_sources:
  g1_model:
    manifest: manifests/vendor/g1-model.json
    terms_required: true
    install_command: SKILLSTORE_ACCEPT_G1_MODEL_TERMS=1 integration/bootstrap.sh --fetch-g1-model
  groot_wbc:
    manifest: manifests/vendor/groot-wbc.json
    install_command: integration/bootstrap.sh --fetch-groot-source
  sonic_python_runtime:
    manifest: manifests/vendor/lerobot.json
    path: third_party/lerobot
  unitree_sdk2_python:
    manifest: manifests/vendor/unitree-sdk2-python.json
    path: third_party/unitree_sdk2_python

runtime:
  primary_os: Ubuntu 24.04
  ros_distribution: jazzy
  simulation_python_manifest: manifests/python/simulation-runtime.json
  vision_python_manifest: manifests/python/vision-runtime.json
  sam2_checkpoint_manifest: manifests/vendor/sam2-checkpoint.json
  bootstrap_huggingface_hub: "1.29.0"
  ros_user_prefix_manifest: manifests/ros/jazzy-user-prefix-amd64.json
  ros_user_prefix_provisioner: integration/provision-ros-prefixes.sh
  python:
    h_ide: "3.12"
    mujoco_sonic: "3.12"
    h_ide_vision: "3.11"
    robotagent: ">=3.10"
  node: ">=22.13.0"
  required_host_services:
    - Docker Engine + Compose v2
    - NVIDIA driver/CUDA for Qwen/SAM2 and SONIC
    - systemd --user (workstation launcher)
    - X11 only when --viewer is selected

known_issues:
  - id: SIM-PLANNER-REFERENCE-DEADLINE-001
    status: accepted-for-r1-demo
    fixed_in_release: false
    scope: MuJoCo simulation
    impact: pure-rotation planner reference timeout can terminalize the Plant and requires a complete cold restart
    reproducibility: R1 intentionally preserves the observed local behavior

acceptance:
  l0: repository hygiene, manifests, paths, shell and JSON syntax
  l1: deterministic component tests, Compose config and Office V2 scene check
  l2: live service health plus ROS, GPU, model and external-asset readiness
  l3: operator-authorized real Mission execution and structured evidence capture
  motion_policy: L0-L2 never send motion; L3 requires explicit execute-motion and operator approval
  results:
    l0: passed-local-and-gitea-clean-clone
    l1: passed-local-and-gitea-clean-clone
    l2: passed-local-final-candidate-no-motion
    l3: owner-accepted-with-known-issue-not-full-pass

secrets:
  file: .env
  mode: "0600"
  source_template: integration/.env.simulation.example
  forbidden_in_git:
    - API keys
    - bearer tokens
    - SQLite databases
    - model weights and checkpoints
    - runtime logs/evidence
  scan_scope:
    current_tree: filename, symlink, size and high-confidence content heuristics
    git_history: filename and blob-size risk inventory
  limitation: heuristic repository checks are not complete secret clearance
