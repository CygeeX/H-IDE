name: Skillstore L0 reproducibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install manifest parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run L0 acceptance
        run: ./integration/acceptance.sh --level L0
